# Local ML services. Start only what you need: the laptop has 16 GB and Supabase also runs in Docker.
#   docker compose up -d mlflow      # experiment tracking UI at http://127.0.0.1:5000
#   docker compose up -d postgres    # Postgres 16 + pgvector on 127.0.0.1:5433 (5432 is left free)
#   docker compose up -d label-studio  # review labelling UI at http://127.0.0.1:8080 (see ml/shevent_ml/reviews)
#   docker compose up -d model-server  # the FastAPI model server at http://127.0.0.1:8000 (server/Dockerfile)
#   docker compose down              # stop everything; data stays in the named volumes

name: shevent

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: shevent
      POSTGRES_PASSWORD: shevent # local only; the port is bound to 127.0.0.1
      POSTGRES_DB: shevent
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./ml/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shevent -d shevent"]
      interval: 5s
      timeout: 3s
      retries: 10

  mlflow:
    # Keep this version in step with the mlflow pin in ml/pyproject.toml.
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts --artifacts-destination /mlflow/artifacts
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-data:/mlflow

  label-studio:
    # Open-source labelling tool for the #6 review aspects. Projects and labels stay in the named volume.
    image: heartexlabs/label-studio:1.13.1
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - label-studio-data:/label-studio/data

  model-server:
    # Needs the trained artifacts in ml/artifacts. With local Supabase running, SUPABASE_KEY is its publishable key
    # (supabase status); without it the server ranks the demo vendors.
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      SUPABASE_URL: http://host.docker.internal:54321
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      # #8 uses Ollama running on the host (ollama pull qwen2.5:3b-instruct).
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - model-feedback:/srv/data/feedback

volumes:
  model-feedback:
  postgres-data:
  mlflow-data:
  label-studio-data:

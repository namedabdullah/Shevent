[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shevent-ml"
version = "0.1.0"
description = "Shevent data pipeline, features and models"
requires-python = ">=3.12,<3.13"
# Each feature branch adds the libraries it needs (lightgbm, mapie, torch, open-clip-torch, ...).
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # Umm al-Qura Hijri calendar (MIT), for the Ramadan / Muharram / Eid features.
    "hijridate>=2.5",
    # Portfolio images (#7): perceptual hashes (BSD-2), image handling (HPND), CLIP embeddings (MIT, BSD-3).
    "imagehash>=4.3",
    "pillow>=10.1",
    "open-clip-torch>=2.24",
    "torch>=2.3",
    # #2 price ranges: gradient-boosted quantile models (MIT).
    "lightgbm>=4.3",
    # Reading the vendor research workbook (MIT).
    "openpyxl>=3.1",
    # Must match the MLflow server image in docker-compose.yml.
    "mlflow==2.17.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pip-audit>=2.7",
    "bandit>=1.7",
]

[tool.setuptools.packages.find]
include = ["shevent_ml*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow tests stay out of the default run; select them with -m, e.g. pytest -m clip.
addopts = "-m 'not metrics and not clip'"
markers = [
    "metrics: model metric thresholds; needs trained artifacts (run with -m metrics)",
    "clip: loads the OpenCLIP weights (downloads about 600 MB on first run; run with -m clip)",
]

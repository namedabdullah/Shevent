  - {query_id: Q06, category: dj_sound, event_type: birthday, guests: 60, area: Johar Town, venue_type: rooftop, event_date: "2027-01-16", total_budget_pkr: 400000}
  - {query_id: Q07, category: venue, event_type: wedding_walima, guests: 500, area: DHA, venue_type: banquet, event_date: "2027-01-23", total_budget_pkr: 4500000}
  - {query_id: Q08, category: lighting, event_type: wedding_baraat, guests: 400, area: Raiwind Road, venue_type: marquee, event_date: "2026-12-05", total_budget_pkr: 3000000}

# Fragments for synthetic reviews (python -m shevent_ml.reviews.synthetic). Written by hand for training #6: the
# collected reviews are almost all 5-star English, so the model would never see a complaint or much Roman Urdu or Urdu.
# Synthetic reviews are training data only. They name no vendor or person, are never linked to a real vendor, and are
# never shown in the apps. The model is scored on real reviews only.
#
# Each aspect fragment is one clause about that aspect, in English (en), Roman Urdu (roman_ur) and Urdu script (ur).
# A review joins one to three of them, so its labels are known exactly: an aspect with a "mixed" fragment is mixed.

# Which aspects a review of each category can talk about, and how often each category is drawn.
categories:
  venue: {weight: 0.30, aspects: [food_quality, sound_quality, staff_behaviour, punctuality, value_for_money, hidden_charges]}
  catering: {weight: 0.25, aspects: [food_quality, staff_behaviour, punctuality, value_for_money, hidden_charges]}
  photography: {weight: 0.20, aspects: [photo_video_quality, punctuality, staff_behaviour, value_for_money, hidden_charges]}
  dj_sound: {weight: 0.10, aspects: [sound_quality, punctuality, staff_behaviour, value_for_money, hidden_charges]}
  decor: {weight: 0.10, aspects: [punctuality, staff_behaviour, value_for_money, hidden_charges]}
  lighting: {weight: 0.05, aspects: [punctuality, staff_behaviour, value_for_money, hidden_charges]}

# How often each language is drawn. "mixed" joins English and Roman Urdu fragments in one review.
languages: {en: 0.40, roman_ur: 0.30, ur: 0.12, mixed: 0.18}

# The overall tone of a review decides which labels its aspects get.
tones:
  negative: {weight: 0.40, labels: {negative: 0.85, mixed: 0.15}}
  mixed: {weight: 0.25, labels: {negative: 0.40, positive: 0.40, mixed: 0.20}}
  positive: {weight: 0.35, labels: {positive: 0.90, mixed: 0.10}}

# Messy writing, as in the real reviews: share of reviews written all in lower case, without final punctuation,
# with one dropped letter, or ending in an emoji.
noise: {lowercase: 0.30, no_punctuation: 0.25, typo: 0.15, emoji: 0.15}
emoji:
  negative: ["😡", "😞", "👎", "😕", "🤬"]
  positive: ["👍", "❤️", "😊", "👌", "🌟"]

connectors:
  contrast:
    en: ["but", "however,", "though", "on the other hand,"]
    roman_ur: ["lekin", "magar", "par", "but"]
    ur: ["لیکن", "مگر", "البتہ"]
  and:
    en: ["and", "also", "plus"]
    roman_ur: ["aur", "or", "sath hi"]
    ur: ["اور", "نیز"]

# Openers say what the event was. Venue openers say "here", so only venue reviews use them.

  any:
    en:
      - "We booked them for my sister's mehndi."
      - "Hired them for our walima last month."
      - "Booked them for my brother's baraat."
      - "Used them for a birthday party."
      - "Booked them after seeing their page."
      - "Had them for our nikah function."
      - ""
      - ""
    roman_ur:
      - "Hum ne apni behen ki mehndi ke liye book kiya tha."
      - "Walima ke liye inko hire kiya tha."
      - "Birthday party ke liye book kiya."
      - "Shadi ke function ke liye inko bulaya tha."
      - ""
      - ""
    ur:
      - "ہم نے بہن کی مہندی کے لیے بک کیا تھا۔"
      - "ولیمے کے لیے ان کی خدمات لی تھیں۔"
      - "سالگرہ کی تقریب کے لیے بک کیا۔"
      - ""
      - ""
  venue:
    en: ["Our family event was here in December.", "We had our office dinner here.", "My brother's baraat was here."]
    roman_ur: ["Bhai ki baraat yahan thi.", "Office ka dinner yahan rakha tha.", "Hamara walima yahan tha."]
    ur: ["بھائی کی بارات یہاں تھی۔", "ہمارا ولیمہ یہاں تھا۔"]

closers:
  negative:
    en: ["Would not recommend.", "Never again.", "Total waste of money.", "Think twice before booking.", "Very disappointed.", ""]
    roman_ur: ["Bilkul recommend nahi karunga.", "Dobara kabhi nahi.", "Paise zaya ho gaye.", "Soch samajh kar book karein.", "Bohat mayoosi hui.", ""]
    ur: ["بالکل تجویز نہیں کروں گا۔", "دوبارہ کبھی نہیں۔", "پیسے ضائع ہو گئے۔", "بہت مایوسی ہوئی۔", ""]
  mixed:
    en: ["Okay overall.", "Average experience.", "Could be better.", "Not bad, not great.", ""]
    roman_ur: ["Overall theek tha.", "Guzara hai.", "Behtar ho sakta tha.", "Average experience tha.", ""]
    ur: ["مجموعی طور پر ٹھیک تھا۔", "گزارا ہے۔", "بہتر ہو سکتا تھا۔", ""]
  positive:
    en: ["Highly recommended!", "Will book again.", "Thank you so much!", "Best in Lahore.", "Great experience.", ""]
    roman_ur: ["Highly recommend karta hoon.", "Dobara zaroor book karenge.", "Bohat shukriya!", "Lahore mein best hain.", ""]
    ur: ["ضرور تجویز کروں گا۔", "دوبارہ ضرور بک کریں گے۔", "بہت شکریہ!", "لاہور میں بہترین ہیں۔", ""]

# Remarks about none of the aspects: the place, decor, parking, ambience, location, or plain praise and complaint.
# About 40% of real reviews say only this ("Nice place", "Beautiful hall"), so the model has to learn that a clause can
# be about no aspect. Some synthetic reviews are made of these alone (all aspects not mentioned).
general:
  positive:
    en: ["beautiful place", "nice venue for events", "the decor was lovely", "great ambience", "ample parking",
         "neat and clean", "excellent", "great experience", "good location", "spacious hall", "very grand venue",
         "lovely atmosphere", "nice place for weddings", "the stage looked stunning", "well maintained"]
    roman_ur: ["bohat khoobsurat jagah hai", "decor bohat acha tha", "mahaul bohat acha tha", "parking ki kaafi jagah hai",
               "safai bohat achi thi", "achi jagah hai", "hall bohat bara aur khula hai", "zabardast experience tha",
               "shadi ke liye behtareen jagah"]
    ur: ["بہت خوبصورت جگہ ہے", "سجاوٹ بہت اچھی تھی", "ماحول بہت اچھا تھا", "پارکنگ کی کافی جگہ ہے", "صفائی بہت اچھی تھی",
         "شادی کے لیے بہترین جگہ"]
  negative:
    en: ["parking was a nightmare", "the hall was too cold", "the entrance was overcrowded", "the place was dirty",
         "the location is hard to reach", "the washrooms were filthy", "the hall looked old and run down",
         "the lighting near the stage was poor"]
    roman_ur: ["parking ki koi jagah nahi thi", "hall bohat thanda tha", "jagah gandi thi", "entrance pe bohat rush tha",
               "hall purana aur khasta haal hai", "washroom bohat gande the"]
    ur: ["پارکنگ کی کوئی جگہ نہیں تھی", "ہال بہت ٹھنڈا تھا", "جگہ گندی تھی", "داخلے پر بہت رش تھا"]


# Settings for the portfolio image pipeline (shevent_ml.images). Change values here, not in code.

# Image embeddings. OpenCLIP ViT-B/32 trained on LAION-2B: small enough for a laptop CPU.
clip:
  model: ViT-B-32
  pretrained: laion2b_s34b_b79k
  batch_size: 32

# The planted-duplicate test set (python -m shevent_ml.images.planted): altered copies of collected photos, the way
# a vendor might repost another vendor's photo.
planted:
  # How many collected photos get copies. Each gets one copy per transform.
  originals: 100
  transforms: [crop, resize, jpeg, colour, grayscale, watermark, border, mirror, repost]
  crop_box: [0.10, 0.05, 0.90, 0.85] # left, top, right, bottom, as fractions of the photo
  resize_scale: 0.5
  jpeg_quality: 35
  colour: {brightness: 1.15, contrast: 1.2, saturation: 1.5}
  border: 0.08 # white frame, as a fraction of the longer side
  watermark_text: "@lahore_events_official"

# Starting thresholds for the duplicate finders. Phase 2 tunes them on the planted set.
duplicates:
  phash_max_distance: 10 # of 64 bits
  clip_min_similarity: 0.92

# Style tags (#7): CLIP zero-shot, each tag scored against the others in its group (scores in a group add up to 1).
# A tag is returned when its score is at least min_score; a photo gets at most max_tags.
tags:
  min_score: 0.3
  max_tags: 4
  prompt: "a photo of {} at a Pakistani wedding or event"
  groups:
    scene:
      stage: "a decorated wedding stage"
      entrance: "a decorated entrance or walkway"
      seating: "guest tables and seating"
      food: "a buffet or food display"
      portrait: "a portrait of the bride or the couple"
      guests: "guests celebrating"
      venue: "an empty banquet hall or marquee"
    style:
      floral: "lots of fresh flowers"
      fairy lights: "fairy lights and warm string lights"
      mehndi colours: "bright yellow, orange and green mehndi decor"
      red and gold: "red and gold decor"
      pastel: "soft pastel decor"
      white and green: "white flowers and greenery"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shevent-server"
version = "0.1.0"
description = "Shevent model server (FastAPI)"
requires-python = ">=3.12,<3.13"
# Runs in the ml/ environment: install ml first (pip install -e ml), then this (pip install -e server).
dependencies = [
    "shevent-ml",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30",
    "httpx>=0.27",
    # uvicorn --env-file
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["shevent_ml", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
